<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVE — Top Detectives</title>
  <link rel="icon" href="assets/icon.png" type="image/png">
  <style>
    :root { --gold:#f5c542; --silver:#cfd6dd; --bronze:#d29a6b; --paper:#f7f3e8; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      display: flex; flex-direction: column; color: var(--paper); text-align: center;
      font-family: "Segoe UI", system-ui, "Noto Sans Thai", sans-serif; overflow: hidden;
      background: radial-gradient(140vmax 90vmax at 50% -10%, #2c3a45 0%, #141c22 55%, #0b1014 100%);
    }
    header { padding: 2.6vh 3vw 1vh; display: flex; align-items: center; justify-content: center; gap: 2.5vw; flex-wrap: wrap; }
    .live { display: inline-flex; align-items: center; gap: .8vmin; font-size: 2vmin; font-weight: 700;
      letter-spacing: .3em; color: #ff6b57; border: 1px solid #ff6b57; border-radius: 999px; padding: .8vmin 2.4vmin; }
    .live i { width: 1.4vmin; height: 1.4vmin; border-radius: 50%; background: #ff6b57; animation: pulse 1.6s infinite; }
    h1 { font-size: 6.2vmin; font-weight: 800; line-height: 1.05; }
    h1 small { display: block; font-size: .42em; font-weight: 400; color: #c9c2ad; }
    #clock { font-size: 2.6vmin; color: #c9c2ad; font-variant-numeric: tabular-nums; }
    .stats { display: flex; justify-content: center; gap: 4vw; margin: 1.2vh 0 .4vh; flex-wrap: wrap; }
    .stat { min-width: 14vmin; }
    .stat b { display: block; font-size: 4.2vmin; color: var(--gold); font-variant-numeric: tabular-nums; }
    .stat span { font-size: 1.7vmin; color: #c9c2ad; letter-spacing: .12em; text-transform: uppercase; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; gap: 3vw; padding: 1vh 3vw; min-height: 0; }
    .champ { flex: 0 1 40vmax; padding: 3.5vmin 4vmin; text-align: left;
      background: linear-gradient(160deg, rgba(245,197,66,.14), rgba(245,197,66,.03));
      border: .45vmin solid var(--gold); border-radius: 3vmin; box-shadow: 0 0 7vmin rgba(245,197,66,.28);
      animation: glow 3s ease-in-out infinite; }
    @keyframes glow { 0%,100% { box-shadow: 0 0 5vmin rgba(245,197,66,.22);} 50% { box-shadow: 0 0 9vmin rgba(245,197,66,.42);} }
    .champ .medal { font-size: 7vmin; }
    .champ .name { font-size: 6vmin; font-weight: 800; word-break: break-word; margin: .6vmin 0; }
    .champ .score { font-size: 8vmin; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }
    .champ .score small { font-size: .4em; color: #c9c2ad; }
    .grid { flex: 1; max-width: 60vmax; display: grid; grid-template-columns: 1fr 1fr;
      gap: 1.4vmin; align-content: center; }
    .row { display: flex; align-items: center; gap: 1.8vmin; padding: 1.5vmin 2.4vmin;
      background: rgba(255,253,247,.06); border: 1px solid rgba(245,197,66,.16);
      border-radius: 1.6vmin; animation: slidein .45s ease both; }
    .row:nth-child(1) { border-color: var(--silver); }
    .grid .row:nth-child(0), .grid .row:first-child { border-color: var(--silver); }
    @keyframes slidein { from { opacity: 0; transform: translateY(1.5vmin);} to { opacity: 1; } }
    .rank { font-size: 3vmin; width: 5.5vmin; text-align: center; }
    .row .alias { flex: 1; text-align: left; font-size: 2.7vmin; font-weight: 700; word-break: break-word; }
    .row .pct { font-size: 3.2vmin; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }
    .empty { grid-column: 1 / -1; font-size: 3vmin; color: #c9c2ad; padding: 6vmin; }
    aside { display: flex; align-items: center; gap: 2vmin; padding: 1.4vh 3vw; justify-content: center; }
    aside img { height: 11vh; border-radius: 1.6vmin; background: #fff; padding: .8vmin; }
    aside div { text-align: left; font-size: 2vmin; color: #c9c2ad; max-width: 40vmin; }
    aside b { color: var(--paper); font-size: 2.4vmin; display: block; }
    .foot { font-size: 1.7vmin; color: #6f6a5c; padding: .4vh 0 1vh; }
    /* New-#1 alert banner */
    #alert-banner {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: linear-gradient(135deg, #f5a623, #e8534a);
      color: #0a0e14; font-weight: 800; font-size: 3vmin;
      padding: 2.5vmin 3vw; text-align: center;
      transform: translateY(-100%); transition: transform .5s cubic-bezier(.16,1,.3,1);
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
    }
    #alert-banner.show { transform: translateY(0); }
    #alert-banner .sub { font-size: .5em; font-weight: 400; opacity: .8; }
    /* Booth sound toggle */
    #booth-sound {
      position: fixed; bottom: 2vh; right: 2vw; z-index: 60;
      background: rgba(16,22,31,.85); color: var(--gold);
      border: 1.5px solid var(--gold); border-radius: 50%;
      width: 6vh; height: 6vh; min-width: 40px; min-height: 40px;
      font-size: 2.5vh; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    @keyframes row-pulse {
      0% { box-shadow: 0 0 0 0 rgba(245,197,66,.5); }
      70% { box-shadow: 0 0 0 12px rgba(245,197,66,0); }
      100% { box-shadow: 0 0 0 0 rgba(245,197,66,0); }
    }
    .row.moved { animation: row-pulse 1.2s ease 2; }
    @media (max-aspect-ratio: 1/1) {          /* portrait screens: stack */
      main { flex-direction: column; }
      .grid { max-width: 92vw; }
      .champ { flex-basis: auto; width: 92vw; }
      aside img { height: 16vh; }
    }
  </style>
</head>
<body>
  <div id="alert-banner"><span id="alert-text"></span><div class="sub" id="alert-sub"></div></div>
  <header>
    <span class="live"><i></i>LIVE</span>
    <h1>🕵️ TOP DETECTIVES<small>นักสืบยอดเยี่ยม</small></h1>
    <span id="clock">--:--:--</span>
  </header>

  <div class="stats">
    <div class="stat"><b id="st-today">0</b><span>playing today</span></div>
    <div class="stat"><b id="st-total">0</b><span>total players</span></div>
    <div class="stat"><b id="st-done">0</b><span>finished</span></div>
    <div class="stat"><b id="st-top">0%</b><span>best score</span></div>
  </div>

  <main>
    <div class="champ" id="champ"></div>
    <div class="grid" id="grid"></div>
  </main>

  <aside>
    <img src="assets/qr.png" alt="QR code">
    <div>
      <b>Scan to play! · สแกนเพื่อเริ่มเล่น</b>
      AI Detective — จำใบหน้าคน แยกใบหน้า AI
    </div>
  </aside>
  <div class="foot" id="updated">connecting… · press F for fullscreen</div>

  <script>
    const MEDALS = ["🥇", "🥈", "🥉"];
    let lastJson = "";
    let prevChamp = "";
    let soundOn = false; // booth sound: opt-in

    /* Booth fanfare (WebAudio) */
    const Booth = {
      ctx: null,
      fanfare() {
        if (!soundOn) return;
        if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return; } }
        const t = this.ctx.currentTime;
        [523, 659, 784, 1047, 784, 1047].forEach((freq, i) => {
          const osc = this.ctx.createOscillator(); osc.type = "triangle"; osc.frequency.value = freq;
          const g = this.ctx.createGain();
          const s = t + i * 0.15, d = 0.4;
          g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(0.15, s + 0.03);
          g.gain.exponentialRampToValueAtTime(0.001, s + d);
          osc.connect(g); g.connect(this.ctx.destination); osc.start(s); osc.stop(s + d);
        });
      },
    };

    document.addEventListener("keydown", (e) => {
      if (e.key === "f" || e.key === "F") {
        document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      }
    });

    function tick() { document.getElementById("clock").textContent = new Date().toLocaleTimeString(); }
    setInterval(tick, 1000); tick();

    function showAlert(text, sub) {
      const banner = document.getElementById("alert-banner");
      document.getElementById("alert-text").textContent = text;
      document.getElementById("alert-sub").textContent = sub;
      banner.classList.add("show");
      Booth.fanfare();
      setTimeout(() => banner.classList.remove("show"), 6000);
    }

    function render(d) {
      document.getElementById("st-today").textContent = d.meta.today;
      document.getElementById("st-total").textContent = d.meta.total;
      document.getElementById("st-done").textContent = d.meta.completed;
      document.getElementById("st-top").textContent = d.meta.top_score + "%";

      const champ = document.getElementById("champ");
      const grid = document.getElementById("grid");
      if (d.board.length) {
        const c = d.board[0];
        // New champion alert
        if (prevChamp && prevChamp !== c.alias) {
          showAlert("🚨 NEW TOP DETECTIVE: " + c.alias, "just cleared " + c.percent + "% of the database!");
        }
        prevChamp = c.alias;
        champ.innerHTML = `<div class="medal">🥇</div>
          <div class="name">${c.alias}</div>
          <div class="score">${c.percent}<small>% spotted</small></div>`;
        grid.innerHTML = d.board.slice(1, 11).map((x, i) =>
          `<div class="row"><div class="rank">${MEDALS[i + 1] ?? i + 2}</div>` +
          `<div class="alias">${x.alias}</div>` +
          `<div class="pct">${x.percent}%</div></div>`).join("");
      } else {
        champ.innerHTML = `<div class="medal">🕵️</div>
          <div class="name">Waiting for the first detective…</div>
          <div class="score">—</div>`;
        grid.innerHTML = `<div class="empty">No detectives yet — scan the QR to play!<br>ยังไม่มีนักสืบ — สแกน QR เพื่อเริ่มเล่น</div>`;
      }
    }

    async function load() {
      try {
        const r = await (await fetch("api/leaderboard.php", { cache: "no-store" })).json();
        if (r.ok) {
          const sig = JSON.stringify(r);
          if (sig !== lastJson) { render(r); lastJson = sig; }
          document.getElementById("updated").textContent =
            "live · updated " + new Date().toLocaleTimeString() + " · press F for fullscreen";
        }
      } catch (e) {
        document.getElementById("updated").textContent = "connection lost — retrying…";
      }
    }
    load();
    setInterval(load, 10000);

    // Booth sound toggle
    const soundBtn = document.createElement("button");
    soundBtn.id = "booth-sound"; soundBtn.textContent = "🔇";
    soundBtn.title = "Toggle booth sound";
    soundBtn.onclick = () => { soundOn = !soundOn; soundBtn.textContent = soundOn ? "🔊" : "🔇"; if (soundOn) Booth.fanfare(); };
    document.body.appendChild(soundBtn);
  </script>
</body>
</html>
